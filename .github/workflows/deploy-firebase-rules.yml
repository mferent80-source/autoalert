name: Deploy Firebase RTDB Rules

on:
  push:
    branches: [master]
    paths:
      - 'database.rules.json'
      - '.github/workflows/deploy-firebase-rules.yml'
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy database rules
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only database --project autoalert-89b80 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
