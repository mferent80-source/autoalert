name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Firebase config
        env:
          CONFIG: ${{ secrets.AA_FIREBASE_CONFIG_JS }}
        shell: bash
        run: |
          if [ -n "$CONFIG" ]; then
            printf '%s\n' "$CONFIG" > firebase-config.js
          else
            cp firebase-config.example.js firebase-config.js
            echo "WARN: AA_FIREBASE_CONFIG_JS lipsește — folosim example.js"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4